# Netlify 배포 설정 — 간다GO 안산 출장마사지 정적 사이트
# GitHub 연결 시 프로덕션 브랜치 푸시마다 자동 재빌드·배포된다.

[build]
  # build.py 는 표준 라이브러리만 사용하므로 추가 설치가 필요 없다.
  command = "python3 build.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

# 정적 파일은 빌드 산출물이 루트에 그대로 놓인다.
# SPA 리다이렉트는 사용하지 않으며, 404 는 사이트 루트의 404.html 이 처리한다.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
